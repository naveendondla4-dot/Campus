<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Buddy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">CB</div><div><b>Campus Buddy</b><small>Student Hub</small></div></div>
    <nav>
      <button class="nav active" data-page="dashboard">🏠 <span>Dashboard</span></button>
      <button class="nav" data-page="timetable">📅 <span>Timetable</span></button>
      <button class="nav" data-page="assignments">📝 <span>Assignments</span></button>
      <button class="nav" data-page="notes">📚 <span>Notes</span></button>
      <button class="nav" data-page="notices">🔔 <span>Notices</span></button>
      <button class="nav" data-page="polls">🗳️ <span>Class Polls</span></button>
      <button class="nav" data-page="tasks">✅ <span>My Tasks</span></button>
    </nav>
    <div class="side-bottom">
      <button class="nav" data-page="profile">👤 <span>Profile</span></button>
      <button class="nav" id="themeBtn">🌙 <span>Dark mode</span></button>
    </div>
  </aside>

  <main>
    <header>
      <button class="menu" id="menuBtn">☰</button>
      <div>
        <div class="eyebrow" id="todayDate"></div>
        <h1 id="pageTitle">Good morning 👋</h1>
      </div>
      <div class="header-actions"><div class="avatar">N</div></div>
    </header>

    <section id="content"></section>
  </main>
</div>
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
